<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Url Shortener</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 350px;
        text-align: center;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 16px;
      }

      button {
        width: 100%;
        padding: 10px;
        font-size: 16px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>URL Shortener</h1>
      <input type="text" id="textInput" placeholder="Enter Long Url..." />
      <button onclick="sendData()">Submit</button>
    </div>

    <script>
      async function sendData() {
        const input = document.getElementById("textInput").value;

        if (!input) {
          alert("Please enter the url");
          return;
        }

        try {
          const response = await fetch(
            "https://euz4jspn09.execute-api.ap-south-1.amazonaws.com/Dev/get-short-url/",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ url: input }),
            }
          );

          const data = await response.json();

          alert("Short URL :: " + JSON.stringify(data.short_url));
        } catch (error) {
          alert("Error: " + error.message);
        }
      }

      // Submit when Enter key is pressed
      document
        .getElementById("textInput")
        .addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            sendData();
          }
        });
    </script>
  </body>
</html>
